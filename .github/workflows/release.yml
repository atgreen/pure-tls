name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Least privilege: creating a release needs contents:write and nothing
    # else.  write-all handed every GITHUB_TOKEN scope to a third-party action.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version number
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The version is interpolated into bodyFile below, so a tag
          # containing ../ would read an arbitrary repo file into the release
          # body. Require a plain semantic version.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing tag '${GITHUB_REF_NAME}': version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Print this version's section: from its heading to the next level-2
          # heading, dropping the heading line itself. Release notes used to be
          # separate files under docs/release-notes/; CHANGELOG.md is now the
          # single source (Keep a Changelog format).
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-body.md
          # Fail loudly rather than publishing a release with an empty body.
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION" >&2
            echo "Add a '## [$VERSION] - YYYY-MM-DD' section before tagging." >&2
            exit 1
          fi
          echo "Extracted $(wc -l < release-body.md) lines for $VERSION"

      - name: Create GitHub release
        # Pinned to a commit SHA, not the mutable v1 tag: a compromised or
        # moved tag would otherwise execute with this job's token.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: pure-tls ${{ github.ref_name }}
          bodyFile: release-body.md
          allowUpdates: true
